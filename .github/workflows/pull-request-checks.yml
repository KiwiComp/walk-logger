# Mirrors checks 1–3 of .claude/skills/verify/SKILL.md; instrumented tests live in instrumented-tests.yml.
name: Pull request checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # gradle/gradle-daemon-jvm.properties asks for Java 25 for the Gradle daemon.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Build, test and lint
        run: ./gradlew --continue assembleDebug testDebugUnitTest lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
